<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Festival Map · Harbour Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#D9D3C6; --ink:#1B1A17; --muted:#5E5A50; --line:#CFC7B6; --soft:#F7F4EE;
  --accent:#2B45C9; --warn-bg:#FFF3E6; --warn-line:#E5B487; --warn-ink:#4A2406;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#1E1D1A; } }
:root[data-theme="dark"]{ --page:#1E1D1A; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--page);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{position:relative;width:390px;height:844px;max-height:100%;overflow:hidden;background:linear-gradient(90deg,#BCD3DB 50%,#E0D9CB 50%);border-radius:36px;box-shadow:0 20px 60px rgba(0,0,0,.25)}

.app{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app input{-webkit-user-select:text;user-select:text}
@media (max-width:440px){ .app{width:100%;height:100%;border-radius:0;box-shadow:none} }

/* map */
.viewport{position:absolute;left:0;right:0;top:0;bottom:0;background:#BCD3DB;overflow:hidden;touch-action:none;cursor:grab}
.viewport.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;will-change:transform}
.world.anim{transition:transform 360ms ease}
.world.anim .art, .world.anim .ov > *{transition:transform 360ms ease, left 360ms ease, top 360ms ease}
@media (prefers-reduced-motion: reduce){ .world.anim, .world.anim .art, .world.anim .ov > *{transition:none} }
.art{position:absolute;left:0;top:0;width:868px;height:1909px;transform-origin:0 0}
.art img{position:absolute;left:0;top:0;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.art svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.ov{position:absolute;left:0;top:0}
.zone{position:absolute;z-index:2;transform:translate(-50%,-50%);padding:2px 10px 3px;border-radius:10px;background:rgba(251,246,234,.82);font-family:'Bricolage Grotesque','Figtree',sans-serif;font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#4A4232;white-space:nowrap;pointer-events:none;text-shadow:0 0 3px #FBF6EA,0 0 3px #FBF6EA,0 0 6px #FBF6EA,0 0 10px rgba(251,246,234,.9);opacity:.9}
.trail{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;letter-spacing:.3px;color:#6B5A36;background:#FBF6EA;padding:1px 6px;border-radius:6px;white-space:nowrap;pointer-events:none}
.trail.v{transform:translate(-50%,-50%) rotate(-90deg)}
.water{position:absolute;transform:translate(-50%,-50%) rotate(-90deg);font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;font-style:italic;letter-spacing:.3em;text-transform:uppercase;color:#4D7385;opacity:.85;pointer-events:none}
.closed{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#A8430C;border:3px solid #fff;display:flex;align-items:center;justify-content:center;pointer-events:none}
.you{position:absolute;width:0;height:0;pointer-events:none;z-index:6000}
.you .halo{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;background:var(--accent);opacity:.18}
.you .core{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}

.pin{position:absolute;transform:translate(-50%,-50%);padding:0;border:none;background:transparent;display:flex;align-items:center;justify-content:center}
.pin .ring{width:var(--d,44px);height:var(--d,44px);flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform 120ms ease, box-shadow 120ms ease}
.pin .ring img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(27,26,23,.25))}
.pin .ttl{position:absolute;top:calc(50% + var(--d,44px)/2 + 3px);left:50%;transform:translateX(-50%);width:max-content;max-width:112px;text-align:center;font-size:11px;line-height:1.15;font-weight:700;color:#2B2A26;padding:1px 6px 2px;border-radius:6px;background:rgba(251,249,244,.94);box-shadow:0 0 0 1px rgba(0,0,0,.05);pointer-events:none}
.pin.notitle .ttl{visibility:hidden}
.pin[aria-pressed="true"]{z-index:5000 !important}
.pin[aria-pressed="true"] .ring{transform:scale(1.15);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent),0 4px 10px rgba(27,26,23,.25)}
.pin[aria-pressed="true"] .ttl{visibility:visible;background:var(--ink);color:#fff;transform:translateX(-50%) translateY(4px)}
.pin:hover .ring{transform:scale(1.06)}
.pin .ring{box-shadow:none}
.thumb{display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.pin .num{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;border:2px solid #fff;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;line-height:16px;text-align:center}

@keyframes march{to{stroke-dashoffset:-36}}
.marching{animation:march 900ms linear infinite}
@media (prefers-reduced-motion: reduce){ .marching{animation:none} }

/* top ui */
.top{position:absolute;left:0;top:0;right:0;z-index:3;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;flex-direction:column;gap:10px;background:#FBF9F4;border-bottom:1px solid #E1DACB;box-shadow:0 2px 10px rgba(27,26,23,.06)}
.searchwrap{position:relative}
.search{height:48px;padding:0 6px 0 14px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(27,26,23,.08)}
.search input{flex:1;min-width:0;height:44px;border:none;background:transparent;font-size:16px}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus-visible{outline:none}
.search:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.results{position:absolute;left:0;right:0;top:56px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(27,26,23,.16);padding:6px;max-height:420px;overflow:auto;z-index:5}
.res{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:8px 10px;background:transparent;border:none;border-radius:10px;text-align:left}
.res:hover,.res.active{background:var(--soft)}
.res .ic{width:36px;height:36px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.res b{display:block;font-size:15px;font-weight:600}
.res span.s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.reshead{font-size:12px;font-weight:700;color:var(--muted);padding:8px 10px 4px}
.empty{padding:14px 12px;font-size:14px;color:var(--muted);line-height:1.4}
.chips{display:flex;flex-direction:column;gap:6px}
.chiprow{display:flex;gap:5px;align-items:center;flex-wrap:nowrap}
.chipmore{display:flex;flex-wrap:wrap;gap:6px}
.chips::-webkit-scrollbar{display:none}
.chip{height:40px;padding:0 10px;gap:5px;border-radius:20px;font-size:13px;flex-shrink:0;font-weight:600;white-space:nowrap;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;gap:6px}
.chip .tick{display:none}
.cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1.5px #fff}
.more{position:relative;width:40px;height:40px;flex-shrink:0;border-radius:20px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0}
.more[aria-expanded="true"]{background:#F2EEE5}
.more .dotc{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.chip[aria-pressed="true"] .tick{display:inline}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 4px 12px 14px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:14px}
.alert b{display:block;font-size:14px;font-weight:600;line-height:1.35;color:var(--warn-ink)}
.alert small{font-size:12px;color:#6E3A10}
.iconbtn{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:12px}
.routebar{padding:12px 10px 10px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(27,26,23,.08);display:flex;flex-direction:column;gap:10px}
.stops{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:14px;font-weight:600}
.stops .arrow{color:var(--muted);font-weight:400}
.meta{font-size:13px;color:var(--muted)}
.pill{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 2px 8px rgba(27,26,23,.1);font-size:14px;font-weight:600;align-self:flex-start;max-width:100%}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{height:44px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:700;border:none}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.outline{background:#fff;border:1px solid var(--line)}

/* controls */
.controls{position:absolute;right:12px;display:flex;flex-direction:column;gap:8px}
.ctl{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(27,26,23,.12)}
.zoomgrp{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(27,26,23,.12);overflow:hidden}
.zoomgrp .ctl{border:none;border-radius:0;box-shadow:none}
.zoomgrp .ctl + .ctl{border-top:1px solid var(--line)}
.keybtn{position:absolute;left:12px;height:44px;padding:0 14px;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 2px 8px rgba(27,26,23,.12);font-size:14px;font-weight:600}
/* legend */
.legend{position:absolute;left:12px;width:300px;max-height:min(440px, 58%);overflow:auto;padding:10px 8px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(27,26,23,.16);display:flex;flex-direction:column;gap:2px}
.lghead{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;padding:0 4px 2px}
.lghead span{font-size:12px;font-weight:500;color:var(--muted)}
.lg{flex-shrink:0;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 10px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left;font-size:14px}
.lg:hover{background:var(--soft)}
.lg[aria-pressed="true"]{background:#EEF0FB;border-color:#B9C2EE}
.lgi{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:36px}
.lgi .thumb + .thumb{display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%}
.lgkey{display:flex;align-items:center;gap:12px;padding:8px 10px;margin-top:4px;border-top:1px solid #EFEAE0;font-size:14px}
.lgkey .lgx{flex:1}
.lgx{flex:1;min-width:0;display:flex;flex-direction:column}
.lgt{font-weight:700}
.lgtick{display:none;color:var(--accent);flex-shrink:0}
.lg[aria-pressed="true"] .lgtick{display:inline}
.lgr{font-size:12px;line-height:1.3;color:var(--muted);margin-top:2px}
.lgall{justify-content:center;font-weight:700;color:var(--accent);border-color:var(--line)}
.legend i{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* sheet */
.sheet{position:absolute;left:0;right:0;padding:10px 20px 20px;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(27,26,23,.14);display:flex;flex-direction:column;gap:14px;max-height:72%;overflow:auto}
.grab{width:36px;height:4px;border-radius:2px;background:#D3CBBA;align-self:center;flex-shrink:0}
.sheet h2{margin:0;font-family:'Bricolage Grotesque','Figtree',sans-serif;font-size:22px;font-weight:700;line-height:1.15}
.hero{padding:14px;border-radius:14px;background:#EEF0FB;display:flex;flex-direction:column;gap:4px}
.hero .when{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:700}
.hero .soon{font-size:14px;font-weight:600;color:var(--accent)}
.level{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--soft);border-radius:12px}
.seg{width:24px;height:8px;border-radius:4px}
.lineup{display:flex;flex-direction:column;gap:2px}
.lineup div{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0;border-bottom:1px solid #EFEAE0}
.lineup div:last-child{border-bottom:none}
.lineup .t{color:var(--muted);white-space:nowrap}
.lineup .cur{font-weight:700}
.note{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:10px}
.actions .btn{height:48px;font-size:15px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px}

/* nav mode */
.navcard{position:absolute;left:16px;right:16px;top:calc(16px + env(safe-area-inset-top,0px));padding:16px;background:var(--ink);color:#fff;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px}
.navcard .lab{font-size:13px;color:#CFCBC2}
.navcard .big{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:700;line-height:1.1}
.navcard .eta{font-size:16px;font-weight:600}
.navcard .btn{height:48px;font-size:15px;border-radius:12px;background:#fff;color:var(--ink)}
.prog{display:flex;gap:6px}
.prog span{flex:1;height:4px;border-radius:2px;background:#4A4740}
.prog span.on{background:#fff}
.navbottom{position:absolute;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.endbtn{flex:1;height:52px;border-radius:14px;border:none;background:#fff;color:#B3261E;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(27,26,23,.2)}

/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:calc(84px + env(safe-area-inset-bottom,0px));padding:6px 8px env(safe-area-inset-bottom,0px);background:#fff;border-top:1px solid #E1DACB;display:flex;align-items:flex-start;gap:2px}
.tab{flex:1;height:56px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent;border:none;border-radius:12px;color:var(--muted);font-size:12px;font-weight:600}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.badge{position:absolute;top:4px;left:50%;margin-left:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#A8430C;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.fab{position:absolute;right:16px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:none;border-radius:24px;box-shadow:0 4px 12px rgba(27,26,23,.25)}
</style>
</head>

  if (fa && fa.stage!==sp.id) fa=null;
  var lc=['#1E6A5A','#A8430C','#9B1C14'][sp.level-1], off='#E4DED2';
  var head, body='';
  var closeBtn='<button type="button" class="iconbtn" id="close" aria-label="Close details" style="background:#F2EEE5;border-radius:22px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  var badge=thumb(sp,56);

  if (fa){
    head='<div style="display:flex;align-items:center;gap:12px">'+badge+'<div style="flex:1;min-width:0"><h2>'+esc(fa.name)+'</h2><div style="font-size:14px;color:var(--muted)">'+sp.name+', '+sp.zone+'</div></div>'+closeBtn+'</div>';
    body+='<div class="hero"><div class="when">'+fmt(fa.start)+' to '+fmt(fa.end)+'</div><div class="soon">'+whenText(fa)+'</div></div>';
  } else {
    head='<div style="display:flex;align-items:center;gap:12px">'+badge+'<div style="flex:1;min-width:0"><h2>'+esc(sp.name)+'</h2><div style="font-size:14px;color:var(--muted)">'+c.label+', '+sp.zone+'</div></div>'+closeBtn+'</div>';
    if (isStage){ var n=nowAt(sp.id), nx=nextAt(sp.id);
      body+='<div><div style="font-size:16px;font-weight:600">'+(n?'Now playing: '+esc(n.name):'Between sets')+'</div><div style="font-size:14px;color:var(--muted);margin-top:4px">'+(nx?'Next up: '+esc(nx.name)+' at '+fmt(nx.start):'No more sets tonight')+'</div></div>';
    } else body+='<div><div style="font-size:16px;font-weight:600">'+esc(sp.status)+'</div><div style="font-size:14px;color:var(--muted);margin-top:4px">'+esc(sp.sub)+'</div></div>';
  }

  // actions
  var inStops=s.stops.indexOf(sp.id)>-1, isDest=s.dest===sp.id, acts='';
  var navIcon='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>';
  var plusIcon='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  var extra='';
  if (isDest) acts='<button type="button" class="btn primary" id="startFromCard" style="flex:1">Start route</button><button type="button" class="btn outline" data-act="removeDest">Remove</button>';
  else if (inStops) acts='<button type="button" class="btn outline" data-act="removeStop" style="flex:1">Remove stop</button>';
  else if (s.dest){
    var before=totalLen(legsFor(routeSeq())), after=totalLen(legsFor([s.youAt].concat(s.stops,[sp.id],[s.dest])));
    var add=Math.round((after-before)*PX_TO_M/WALK_M_PER_MIN);
    extra='<div class="note">On the way to '+findPin(s.dest).name+'. '+(add<1?'Adds less than a minute.':'Adds about '+add+' min.')+'</div>';
    acts='<button type="button" class="btn primary" data-act="addStop" style="flex:1">'+plusIcon+'Add stop</button><button type="button" class="btn outline" data-act="directions">'+navIcon+'Go here instead</button>';
  } else acts='<button type="button" class="btn primary" data-act="directions" style="flex:1">'+navIcon+'Directions</button>';

  var level='<div class="level"><div style="font-size:13px;font-weight:700;color:var(--muted);width:52px">'+(isStage||sp.id==='view'?'Crowd':'Line')+'</div>'
    + '<div aria-hidden="true" style="display:flex;gap:4px"><span class="seg" style="background:'+lc+'"></span><span class="seg" style="background:'+(sp.level>=2?lc:off)+'"></span><span class="seg" style="background:'+(sp.level>=3?lc:off)+'"></span></div>'
    + '<div style="font-size:14px;font-weight:600">'+esc(sp.levelText)+'</div></div>';

  var lineup='';
  if (isStage){ lineup='<div><div style="font-size:13px;font-weight:700;color:var(--muted);margin-bottom:2px">Tonight at '+sp.name+'</div><div class="lineup">'
    + stageSets(sp.id).map(function(a){ return '<div class="'+(fa&&a.id===fa.id?'cur':'')+'"><span>'+esc(a.name)+'</span><span class="t">'+fmt(a.start)+'</span></div>'; }).join('')+'</div></div>'; }

  var access = sp.access ? '<div style="display:flex;gap:10px;align-items:flex-start"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E6A5A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0">'+ICONS.chair+'</svg><div style="font-size:14px;line-height:1.4">'+esc(sp.access)+'</div></div>' : '';

  return '<section class="sheet" aria-label="'+esc(fa?fa.name:sp.name)+' details" style="bottom:'+bottom+'"><div class="grab"></div>'
    + head + body + extra + '<div class="actions">'+acts+'</div>' + level + lineup + access + '</section>';
}

/* ================= navigation mode ================= */
var raf=null, lastT=0, SPEED=150; // map px per second in the demo
function startNav(){
  var legs=legsFor(routeSeq()); if(!legs.length) return;
  state.nav={ legs:legs, leg:0, d:0, status:'walking', walked:0 }; state.selected=null; state.follow=true; state.searchOpen=false;
  render(); centerOn(youPos[0],youPos[1],1.1,0.55,true);
  say('Route started. Next stop: '+findPin(legs[0].to).name);
  setTimeout(function(){ lastT=performance.now(); raf=requestAnimationFrame(tick); }, 380);
}
function posAlong(pts,d){ for (var i=0;i<pts.length-1;i++){ var L=dist(pts[i],pts[i+1]); if (d<=L){ var t=L?d/L:0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*t, pts[i][1]+(pts[i+1][1]-pts[i][1])*t, i]; } d-=L; } var e=pts[pts.length-1]; return [e[0],e[1],pts.length-2]; }
function tick(t){
  var n=state.nav; if(!n || n.status!=='walking') return;
  var dt=Math.min(0.05,(t-lastT)/1000); lastT=t; var leg=n.legs[n.leg];
  n.d=Math.min(leg.len, n.d+SPEED*dt);
  var p=posAlong(leg.pts,n.d); youPos=[p[0],p[1]];
  drawNavLines(p);
  place($('you'), youPos[0], youPos[1]);
  if (state.follow){ centerOn(youPos[0],youPos[1],Z,0.55,false); }
  if (n.d>=leg.len){ n.walked+=leg.len; n.status = n.leg===n.legs.length-1 ? 'done' : 'arrived'; state.youAt=leg.to;
    say(n.status==='done' ? 'You have arrived at '+findPin(leg.to).name : 'You are at '+findPin(leg.to).name); renderNav(); return; }
  renderNavEta(); raf=requestAnimationFrame(tick);
}
function drawNavLines(p){
  var n=state.nav, done=[], rest=[];
  n.legs.forEach(function(l,i){
    if (i<n.leg) done.push(l.pts);
    else if (i===n.leg && p){ done.push(l.pts.slice(0,p[2]+1).concat([[p[0],p[1]]])); rest.push([[p[0],p[1]]].concat(l.pts.slice(p[2]+1))); }
    else rest.push(l.pts);
  });
  var rd=routeD(rest);
  $('routeDone').setAttribute('d',routeD(done)); $('route').setAttribute('d',rd); $('routeCasing').setAttribute('d',rd);
  $('route').setAttribute('stroke-dasharray','14 4'); $('route').classList.add('marching');
}
function navLeft(){ var n=state.nav, leg=n.legs[n.leg]; return leg.len-n.d; }
function renderNavEta(){ var el=$('navEta'); if(!el) return; var left=navLeft(); el.textContent=walkMin(left)+' min, '+meters(left)+' m'; }
function renderNav(){
  var n=state.nav, box=$('navui');
  if (!n){ box.innerHTML=''; return; }
  var leg=n.legs[n.leg], to=findPin(leg.to), c=CATS[to.cat], total=n.legs.length;
  var prog='<div class="prog" aria-hidden="true">'+n.legs.map(function(l,i){ return '<span class="'+(i<n.leg||(i===n.leg&&n.status!=='walking')?'on':'')+'"></span>'; }).join('')+'</div>';
  var ic=thumb(to,48);
  var card;
  if (n.status==='walking'){
    card='<div class="lab">Stop '+(n.leg+1)+' of '+total+(n.leg===total-1?', your destination':'')+'</div>'
      + '<div style="display:flex;align-items:center;gap:12px">'+ic+'<div><div class="lab" style="margin-bottom:2px">Next</div><div class="big">'+to.name+'</div></div></div>'
      + '<div class="eta" id="navEta">'+walkMin(navLeft())+' min, '+meters(navLeft())+' m</div>'+prog;
  } else if (n.status==='arrived'){
    var nxt=findPin(n.legs[n.leg+1].to);
    card='<div style="display:flex;align-items:center;gap:12px">'+ic+'<div><div class="lab" style="margin-bottom:2px">You\'re at</div><div class="big">'+to.name+'</div></div></div>'
      + '<div class="eta">Take your time. Then head to '+nxt.name+', '+walkMin(n.legs[n.leg+1].len)+' min away.</div>'+prog
      + '<button type="button" class="btn" id="continue">Continue to '+nxt.name+'</button>';
  } else {
    var fa=findArtist(state.destArtist), mins=walkMin(n.walked), artistLine='';
    if (fa && fa.stage===to.id){ var t=state.clock+mins; artistLine = fa.start>t ? fa.name+' starts at '+fmt(fa.start)+', in '+dur(fa.start-t)+'.' : (fa.end>t ? fa.name+' is playing now.' : ''); }
    card='<div style="display:flex;align-items:center;gap:12px">'+ic+'<div><div class="lab" style="margin-bottom:2px">You\'ve arrived at</div><div class="big">'+to.name+'</div></div></div>'
      + (artistLine?'<div class="eta">'+esc(artistLine)+'</div>':'')+prog
      + '<button type="button" class="btn" id="finish">Done</button>';
  }
  box.innerHTML='<div class="navcard" role="region" aria-label="Navigation">'+card+'</div>'
    + '<div class="navbottom">'+(state.follow?'':'<button type="button" class="ctl" id="recenter" aria-label="Follow my location" style="width:52px;height:52px;border-radius:14px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="'+accent+'" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>')
    + (n.status==='done'?'':'<button type="button" class="endbtn" id="endnav">End route</button>')+'</div>';
}
function endNav(finished){
  cancelAnimationFrame(raf);
  if (finished && state.nav){ state.clock+=walkMin(state.nav.walked); }
  state.nav=null; state.dest=null; state.destArtist=null; state.stops=[]; state.follow=true; state.query=''; $('q').value=''; state.focusArtist=null;
  if (!finished){ /* you stay where you stopped walking */ var best=null,bd=1e9; for (var k in NODES){ var d=dist(NODES[k],youPos); if (d<bd){ bd=d; best=k; } } state.youAt=best; youPos=NODES[best].slice(); }
  render(); say(finished?'Route finished':'Route ended');
}

/* ================= actions ================= */
function toggleFilter(f){ var fs=state.filters.slice();
  if (f==='all') fs=[]; else { var i=fs.indexOf(f); if (i>-1) fs.splice(i,1); else fs.push(f); if (fs.length===FILTERS.length-1) fs=[]; }
  set({filters:fs}); say(fs.length ? 'Showing '+fs.map(filterName).join(' and ') : 'Showing everything'); }
function set(p){ for (var k in p) state[k]=p[k]; render(); }
document.addEventListener('click', function(e){
  var t=e.target;
  if (state.legend && !t.closest('.legend') && !t.closest('#legendbtn')){ state.legend=false; render(); }
  var res=t.closest('.res'); if (res){ res.dataset.artist?chooseArtist(res.dataset.artist):choosePlace(res.dataset.place); return; }
  var pin=t.closest('.pin');
  if (pin){ if (justDragged || state.nav) return; var id=pin.dataset.id, was=state.selected===id;
    set({selected: was?null:id, focusArtist: was?null:(findArtist(state.focusArtist)&&findArtist(state.focusArtist).stage===id?state.focusArtist:null)});
    if(!was){ focusPin(findPin(id)); }
    var nb=document.querySelector('.pin[data-id="'+id+'"]'); if (nb) nb.focus({preventScroll:true}); return; }
  if (t.closest('#viewport')){ if (!justDragged && state.selected && !state.nav) set({selected:null,focusArtist:null}); return; }
  var chip=t.closest('.chip, .lg'); if (chip){ toggleFilter(chip.dataset.f); return; }
  var b=t.closest('button'); if(!b) return;
  var act=b.dataset.act, sp=findPin(state.selected);
  if (act==='directions'){ var fa0=findArtist(state.focusArtist); state.destArtist=(fa0&&fa0.stage===sp.id)?fa0.id:null; state.dest=sp.id; state.stops=state.stops.filter(function(x){return x!==sp.id;}); state.selected=null; render(); fitPts(allPts(legsFor(routeSeq())),true); say('Route to '+sp.name+' ready'); return; }
  if (act==='addStop'){ state.stops.push(sp.id); state.selected=null; render(); fitPts(allPts(legsFor(routeSeq())),true); say(sp.name+' added as a stop on the way'); return; }
  if (act==='removeStop'){ state.stops=state.stops.filter(function(x){return x!==sp.id;}); render(); return; }
  if (act==='removeDest'){ state.dest=state.stops.pop()||null; render(); return; }
  switch(b.id){
    case 'dismiss': set({alertDismissed:true}); break;
    case 'clear': set({dest:null,stops:[]}); say('Route cleared'); break;
    case 'start': case 'startFromCard': startNav(); break;
    case 'close': case 'pill': set({selected:null,focusArtist:state.focusArtist}); break;
    case 'hideTabs': set({tabsOpen:false}); break;
    case 'showTabs': set({tabsOpen:true}); break;
    case 'qclear': state.query=''; $('q').value=''; state.searchOpen=false; render(); $('q').focus(); break;
    case 'zin': zoomAt(Z*1.4, vb().W/2, vb().H/2, true); break;
    case 'zout': zoomAt(Z/1.4, vb().W/2, vb().H/2, true); break;
    case 'locate': centerOn(youPos[0],youPos[1],Math.max(Z,1),0.55,true); break;
    case 'legendbtn': set({legend:!state.legend}); break;
    case 'morefilters': set({moreFilters:!state.moreFilters}); break;
    case 'continue': state.nav.leg++; state.nav.d=0; state.nav.status='walking'; state.follow=true; renderNav(); lastT=performance.now(); raf=requestAnimationFrame(tick); break;
    case 'finish': endNav(true); break;
    case 'endnav': endNav(false); break;
    case 'recenter': state.follow=true; renderNav(); centerOn(youPos[0],youPos[1],Z,0.55,true); break;
  }
});
document.addEventListener('keydown', function(e){ if (e.key!=='Escape') return; if (state.legend){ set({legend:false}); return; } if (state.selected && !state.nav) set({selected:null}); });

render();
centerOn(NODES.YOU[0]-150, NODES.YOU[1]-20, 0.85, 0.5, false);
</script>
